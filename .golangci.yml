version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - gocritic
  settings:
    errcheck:
      # Close/Sync are exactly the errors this project cannot afford to drop.
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      # Tests get a bit more slack: table-driven helpers and t.Helper()
      # wrappers routinely produce false positives on these.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic

formatters:
  enable:
    - gofmt
